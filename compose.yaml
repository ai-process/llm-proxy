# Local stack: the proxy plus Postgres and Redis.
#
#   docker compose up --build
#
# Bootstrap: grpcurl with the BOOTSTRAP_ADMIN_KEY below to mint keys, set
# vendor keys and seed models/rules. gRPC: localhost:9090, health: :8080.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: llmproxy
      POSTGRES_DB: llmproxy
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmproxy -d llmproxy"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  llm-proxy:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://llmproxy:llmproxy@db:5432/llmproxy?sslmode=disable
      # Dev-only keyring; generate a real one for prod:
      #   echo "1:$(head -c 32 /dev/urandom | base64)"
      LLMPROXY_ENCRYPTION_KEYS: "1:LS1kZXYtb25seS1rZXktLWRldi1vbmx5LWtleS0tISE="
      BOOTSTRAP_ADMIN_KEY: dev-bootstrap
      REDIS_ADDR: redis:6379
      REDIS_KEY_PREFIX: dev
    ports:
      - "8080:8080"
      - "9090:9090"
